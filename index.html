<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하은이 블로그 툴</title>

<style>
body{
    font-family:'Pretendard',sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:300px;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    padding:12px 20px;
    border:none;
    background:#222;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

.result{
    margin-top:20px;
}

.output{
    background:white;
    padding:20px;
    border-radius:10px;
    min-height:200px;
    white-space:pre-wrap;
    line-height:1.9;
}

.stats{
    margin-top:15px;
    background:white;
    padding:15px;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>하은이 블로그 툴</h1>

<input type="text" id="keyword" placeholder="키워드 입력">

<textarea id="inputText" placeholder="원고 붙여넣기"></textarea>

<button onclick="convertText()">모바일 최적화</button>

<div class="result">

<div class="stats">
<p>공백 제외 글자수 : <span id="charCount">0</span></p>
<p>키워드 횟수 : <span id="keywordCount">0</span></p>
</div>

<div class="output" id="output"></div>

<button onclick="copyText()">복사하기</button>

</div>

</div>

<script>

function convertText(){

let text=document.getElementById("inputText").value;
let keyword=document.getElementById("keyword").value;

text=text
.replace(/제목:.*/gi,"")
.replace(/"/g,"")
.trim();

const sentences=text.match(/[^.!?]+[.!?]?/g)||[];

let result="";
let section=1;
let count=0;

result+=section+"\n\n";

sentences.forEach(sentence=>{

sentence=sentence.trim();

if(!sentence) return;

let words = sentence.split(" ");
let line = "";
let wrapped = "";

words.forEach(word=>{

if((line + word).length > 25){

wrapped += line.trim() + "\n";
line = word + " ";

}else{

line += word + " ";

}

});

wrapped += line.trim() + "\n";

}

result+=wrapped+"\n";

count++;

if(count>=4){

section++;
result+="\n"+section+"\n\n";
count=0;

}

});

document.getElementById("output").innerText=result;

let noSpace=result.replace(/\s/g,"");
document.getElementById("charCount").innerText=noSpace.length;

if(keyword){

let regex=new RegExp(keyword,"g");
let keywordCount=(result.match(regex)||[]).length;

document.getElementById("keywordCount").innerText=keywordCount;

}else{

document.getElementById("keywordCount").innerText=0;

}

}

function copyText(){

let text=document.getElementById('output').innerText;

navigator.clipboard.writeText(text);

alert("복사 완료!");

}

</script>

</body>
</html>
