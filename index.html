<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 원고 정렬기</title>

<style>
body{
    font-family:Malgun Gothic,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

textarea{
    width:100%;
    height:300px;
    padding:15px;
    box-sizing:border-box;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#output{
    margin-top:20px;
    background:#fff;
    padding:20px;
    white-space:pre-wrap;
    min-height:300px;
    border:1px solid #ddd;
}

.info{
    margin-top:15px;
}
</style>

</head>

<body>

<div class="container">

<h1>하은이 블로그 툴</h1>

<input type="text" id="keyword" placeholder="키워드 입력">

<textarea id="inputText" placeholder="원고 붙여넣기"></textarea>

<br><br>

<button onclick="convertText()">모바일 정렬</button>

<button onclick="copyText()">복사하기</button>

<div class="info">
공백제외 글자수 :
<span id="charCount">0</span>
<br><br>
키워드 횟수 :
<span id="keywordCount">0</span>
</div>

<div id="output"></div>

</div>

<script>

function convertText(){

const text=document.getElementById("inputText").value;

const keyword=document.getElementById("keyword").value;

let words=text.split(" ");

let result="";
let line="";

for(let i=0;i<words.length;i++){

if((line + words[i]).length > 22){

result += line.trim() + "\n";

line = words[i] + " ";

}else{

line += words[i] + " ";

}

}

result += line.trim();

document.getElementById("output").innerText=result;

const noSpace=result.replace(/\s/g,"");

document.getElementById("charCount").innerText=noSpace.length;

if(keyword){

const regex=new RegExp(keyword,"g");

const count=(result.match(regex)||[]).length;

document.getElementById("keywordCount").innerText=count;

}else{

document.getElementById("keywordCount").innerText=0;

}

}

function copyText(){

const text=document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("복사 완료");

}

</script>

</body>
</html>
