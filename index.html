<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하은이 블로그 툴</title>

<style>

body{
    font-family:Malgun Gothic,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:350px;
    padding:15px;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
}

input{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.output{
    background:white;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    line-height:2;
    min-height:300px;
}

.stats{
    margin:15px 0;
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h2>하은이 블로그 툴</h2>

<input type="text" id="keyword" placeholder="키워드 입력">

<textarea id="inputText" placeholder="원고 붙여넣기"></textarea>

<br><br>

<button onclick="convertText()">모바일 정렬</button>

</div>

<div class="stats">

공백 제외 글자수 : <span id="charCount">0</span>

<br><br>

키워드 횟수 : <span id="keywordCount">0</span>

</div>

<div class="output" id="output"></div>

<br>

<button onclick="copyText()">복사하기</button>

</div>

<script>

function convertText(){

let text=document.getElementById("inputText").value.trim();

let keyword=document.getElementById("keyword").value.trim();

if(!text){

alert("원고를 입력하세요.");

return;

}

text=text.replace(/\.\s*/g,".\n\n");

let paragraphs=text.split(/\n\s*\n/);

let result="";

paragraphs.forEach(paragraph=>{

paragraph=paragraph.trim();

if(!paragraph) return;

let words=paragraph.split(/\s+/);

let line="";

words.forEach(word=>{

if((line+word).length>22){

result+=line.trim()+"\n";

line=word+" ";

}else{

line+=word+" ";

}

});

result+=line.trim()+"\n\n";

});

document.getElementById("output").innerText=result;

let noSpace=result.replace(/\s/g,"");

document.getElementById("charCount").innerText=noSpace.length;

if(keyword){

let regex=new RegExp(keyword,"g");

let count=(result.match(regex)||[]).length;

document.getElementById("keywordCount").innerText=count;

}else{

document.getElementById("keywordCount").innerText=0;

}

}

function copyText(){

let text=document.getElementById("output").innerText;

navigator.clipboard.writeText(text);

alert("복사 완료!");

}

</script>

</body>
</html>
